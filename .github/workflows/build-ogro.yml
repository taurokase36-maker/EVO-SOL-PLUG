name: Compilar OGRO (Mac)

on:
  push:
    branches: [ main, master ]
    paths:
      - "ogro/**"
      - "Source/dsp/**"
      - ".github/workflows/build-ogro.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    name: OGRO VST3 + AU universal (Intel y Apple Silicon)
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar (binario universal, macOS 10.13 o superior)
        run: |
          cmake -S ogro -B build-ogro \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13

      - name: Compilar
        run: cmake --build build-ogro --config Release --parallel 4 --target OGRO_VST3 OGRO_AU OGRO_Standalone

      - name: Firmar (ad-hoc) y verificar arquitecturas
        run: |
          ART="build-ogro/OGRO_artefacts/Release"
          for b in "$ART/VST3/OGRO.vst3" "$ART/AU/OGRO.component" "$ART/Standalone/OGRO.app"; do
            codesign --force --deep --sign - "$b"
          done
          lipo -info "$ART/VST3/OGRO.vst3/Contents/MacOS/OGRO"
          lipo -info "$ART/AU/OGRO.component/Contents/MacOS/OGRO"

      - name: Validar Audio Unit (auval)
        continue-on-error: true
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build-ogro/OGRO_artefacts/Release/AU/OGRO.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          sleep 3
          auval -v aumu Ogro Evts

      - name: Validar VST3 (pluginval)
        continue-on-error: true
        run: |
          curl -sL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --skip-gui-tests \
            --validate "build-ogro/OGRO_artefacts/Release/VST3/OGRO.vst3"

      - name: Armar paquete para instalar
        run: |
          ART="build-ogro/OGRO_artefacts/Release"
          PKG="OGRO-mac"
          mkdir -p "$PKG"
          cp -R "$ART/VST3/OGRO.vst3" "$PKG/"
          cp -R "$ART/AU/OGRO.component" "$PKG/"
          cp -R "$ART/Standalone/OGRO.app" "$PKG/"
          cp "ogro/installer/Instalar OGRO.command" "$PKG/"
          chmod +x "$PKG/Instalar OGRO.command"
          cp ogro/installer/LEEME.txt "$PKG/"
          ditto -c -k --sequesterRsrc --keepParent "$PKG" OGRO-mac.zip

      - name: Subir el plugin listo para descargar
        uses: actions/upload-artifact@v4
        with:
          name: OGRO-mac
          path: OGRO-mac.zip
          retention-days: 90
